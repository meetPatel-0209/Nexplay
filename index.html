/* ----- direct connection (WebRTC, manual code exchange, host-authoritative) ----- */
const RTC_CFG={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
const TA='width:100%;min-height:110px;margin-top:8px;font:12px monospace;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--t);padding:8px;word-break:break-all;resize:vertical';
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const b64d=s=>JSON.parse(decodeURIComponent(escape(atob(String(s).replace(/\s+/g,'')))));
const iceDone=(pc,ms=5000)=>new Promise(res=>{if(pc.iceGatheringState==='complete')return res();const t=setTimeout(res,ms);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);res()}})});
const dShell=(t,b)=>`<div class="gh"><button class="btn" data-mp="lobby">← Back</button><div class="sp"><h2>${esc(t)}</h2><span class="badge">Direct connection</span></div></div><div class="stage" style="max-width:640px">${b}</div>`;
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied!')}catch(e){const ta=$('#dout');if(ta){ta.focus();ta.select();try{document.execCommand('copy');toast('Copied!')}catch(er){toast('Select the code and copy it manually.')}}}}

async function mpDirectHost(gk){
  if(gk==='ringout')return rtCreate(()=>{});if(GM[gk])return mpGroupHostManual(gk);
  const G=MP[gk];if(!G)return;
  if(!window.RTCPeerConnection)return toast('Direct connection isn\'t supported in this browser.');
  let pc,dc,alive=true,peer=null;
  try{pc=new RTCPeerConnection(RTC_CFG);dc=pc.createDataChannel('g')}catch(e){return toast('Could not start a direct connection here.')}
  cleanup=()=>{alive=false;main.onclick=main.oninput=main.onkeydown=null;try{pc.close()}catch(e){}};
  main.oninput=main.onkeydown=null;window.scrollTo(0,0);
  main.innerHTML=dShell('Host: '+G.name,'<p class="muted">Creating your invite code…</p>');
  const st=m=>{const e=$('#dst');if(e)e.textContent=m};
  dc.onopen=()=>{if(alive){alive=false;mpDirectPlay({host:true,gk,dc,pc,peer:peer||{name:'Friend',av:'🎮'}})}};
  pc.onconnectionstatechange=()=>{if(alive&&pc.connectionState==='failed')st('Could not connect — the networks may be blocking a direct link. Try both devices on the same Wi-Fi.')};
  const h=async e=>{if(main.onclick!==h)return;const x=e.target.closest('[data-mp]');if(!x)return;const a=x.dataset.mp;
    if(a==='lobby')return go('multiplayer');
    if(a==='copy')return copyText($('#dout').value);
    if(a==='apply'){try{const r=b64d($('#din').value);if(typeof r.s!=='string'||r.s.length>20000)throw 0;peer={name:cleanP({name:r.n}).name,av:cleanP({av:r.a}).av};st('Connecting…');await pc.setRemoteDescription({type:'answer',sdp:r.s})}catch(er){st('That reply code isn\'t valid. Paste the whole code your friend sent.')}}};
  main.onclick=h;
  try{await pc.setLocalDescription(await pc.createOffer());await iceDone(pc);if(!alive)return;
    const code=b64e({g:gk,n:pname(),a:S.avatar,s:pc.localDescription.sdp});
    main.innerHTML=dShell('Host: '+G.name,`<div class="card pad"><b>Step 1</b> — send this invite code to your friend (any chat app):<textarea id="dout" readonly onfocus="this.select()" style="${TA}">${code}</textarea><div class="row"><button class="btn p" data-mp="copy">Copy invite code</button></div></div>
    <div class="card pad"><b>Step 2</b> — paste the reply code they send back, then tap Connect:<textarea id="din" style="${TA}" placeholder="Paste reply code here"></textarea><div class="row"><button class="btn p" data-mp="apply">Connect</button></div></div><p class="msg" id="dst" role="status">Waiting for your friend…</p>`)}
  catch(er){if(alive)main.innerHTML=dShell('Host: '+G.name,'<p class="msg">Could not create an invite code on this device/network. Try Pass &amp; play instead.</p>')}}

function mpDirectJoin(){
  if(!window.RTCPeerConnection)return toast('Direct connection isn\'t supported in this browser.');
  let pc=null,alive=true;
  cleanup=()=>{alive=false;main.onclick=main.oninput=main.onkeydown=null;try{pc&&pc.close()}catch(e){}};
  main.oninput=main.onkeydown=null;window.scrollTo(0,0);
  main.innerHTML=dShell('Join a direct game',`<div class="card pad"><b>Step 1</b> — paste the invite code from the host:<textarea id="din" style="${TA}" placeholder="Paste invite code here"></textarea><div class="row"><button class="btn p" data-mp="mk">Create reply code</button></div></div><div id="dstep2"></div><p class="msg" id="dst" role="status"></p>`);
  const st=m=>{const e=$('#dst');if(e)e.textContent=m};
  const h=async e=>{if(main.onclick!==h)return;const x=e.target.closest('[data-mp]');if(!x)return;const a=x.dataset.mp;
    if(a==='lobby')return go('multiplayer');
    if(a==='copy')return copyText($('#dout').value);
    if(a==='mk'){let inv;try{inv=b64d($('#din').value);if(inv&&GM[inv.g]&&inv.grp&&typeof inv.s==='string'&&inv.s.length<=20000)return mpGroupJoinFrom(inv,st);if(!MP[inv.g]||typeof inv.s!=='string'||inv.s.length>20000)throw 0}catch(er){return st('That invite code isn\'t valid. Paste the whole code.')}
      try{if(pc)pc.close()}catch(er){}
      st('Creating reply code…');
      try{pc=new RTCPeerConnection(RTC_CFG);const host={name:cleanP({name:inv.n}).name,av:cleanP({av:inv.a}).av};
        pc.ondatachannel=ev=>{const dc=ev.channel,go2=()=>{if(alive){alive=false;mpDirectPlay({host:false,gk:inv.g,dc,pc,peer:host})}};if(dc.readyState==='open')go2();else dc.onopen=go2};
        pc.onconnectionstatechange=()=>{if(alive&&pc.connectionState==='failed')st('Could not connect — try both devices on the same Wi-Fi.')};
        await pc.setRemoteDescription({type:'offer',sdp:inv.s});await pc.setLocalDescription(await pc.createAnswer());await iceDone(pc);
        const code=b64e({n:pname(),a:S.avatar,s:pc.localDescription.sdp});
        $('#dstep2').innerHTML=`<div class="card pad"><b>Step 2</b> — send this reply code back to the host, then keep this page open:<textarea id="dout" readonly onfocus="this.select()" style="${TA}">${code}</textarea><div class="row"><button class="btn p" data-mp="copy">Copy reply code</button></div></div>`;
        st('Waiting for the host to connect…')}
      catch(er){st('Could not create a reply — is the invite code complete?')}}};
  main.onclick=h}

function mpDirectPlay({host,gk,dc,pc,peer}){
  const G=MP[gk],me=host?0:1;let full=null,s=null,started=false,games=0,pending=false,counted=false,alive=true,dead=false;
  const mine={name:pname(),av:S.avatar},nm=host?[mine.name,peer.name]:[peer.name,mine.name],av=host?[mine.av,peer.av]:[peer.av,mine.av];
  const send=o=>{try{dc.send(JSON.stringify(o))}catch(e){}};
  const cur=()=>host?(full?G.pub(full):null):s;
  const share=()=>{if(host)send({t:'state',s:full?G.pub(full):null,st:started})};
  function start(){games++;full=G.init();if('turn' in full)full.turn=(games-1)%2;started=true;counted=false;share();draw()}
  function hostAct(a){if(!full)return;const n=G.apply(full,0,a);if(!n)return;full=n;beep(440,.05);share();draw()}
  function guestAct(a){if(pending||dead)return;pending=true;send({t:'act',a});draw();setTimeout(()=>{if(alive&&pending){pending=false;draw()}},4000)}
  dc.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}if(!m||typeof m!=='object')return;
    if(host){if(m.t==='act'&&full){const n=G.apply(full,1,m.a);if(n){full=n;beep(330,.05);share();draw()}}else if(m.t==='rematch'&&full&&full.over)start()}
    else if(m.t==='state'){s=m.s;started=!!m.st;pending=false;draw()}};
  const drop=()=>{if(alive&&!dead){dead=true;draw()}};
  dc.onclose=drop;pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))drop()};
  function draw(){if(!alive)return;const state=cur();let body;
    if(!started||!state)body=host?`<div class="card pad empty"><h3>${esc(nm[1])} is connected ✅</h3><div class="row" style="justify-content:center"><button class="btn p" data-mp="start">Start game</button></div></div>`:`<div class="card pad empty"><h3>Connected! Waiting for the host to start…</h3></div>`;
    else{try{body=G.view(state,me,nm.map(esc),!pending&&!dead)}catch(e){body='<div class="card pad empty">Could not display the game state.</div>'}
      if(state.over){if(!counted){counted=true;const m=S.mp||(S.mp={w:0,l:0,d:0});if(state.win==='d')m.d++;else if(state.win===me)m.w++;else m.l++;save()}
        body+=`<div class="row" style="justify-content:center"><button class="btn p" data-mp="rematch">${host?'Rematch':'Ask for rematch'}</button></div>`}else counted=false}
    const pl=[0,1].map(i=>`<div style="display:flex;align-items:center;gap:8px"><span style="font-size:22px">${av[i]}</span><b>${esc(nm[i])}</b><span class="muted">${i===0?'host':'guest'}${i===me?' · you':''}</span><span style="width:9px;height:9px;border-radius:50%;display:inline-block;background:${dead?'#ef4444':'#22c55e'}"></span></div>`).join('');
    main.innerHTML=`<div class="gh"><button class="btn" data-mp="lobby">← Leave</button><div class="sp"><h2>${G.name}</h2><span class="badge">Direct connection</span></div></div><div class="card pad" style="margin-top:14px"><div style="display:grid;gap:8px">${pl}</div></div>${dead?'<p class="msg" style="color:#ef4444">Connection lost. Go back and start a new game.</p>':''}<div class="stage">${body}${!host&&pending?'<p class="muted" style="text-align:center">Sending move…</p>':''}</div>`}
  const h=e=>{if(main.onclick!==h)return;const x=e.target.closest('[data-mp],[data-act]');if(!x)return;
    if(x.dataset.mp==='lobby')return go('multiplayer');if(!alive||dead)return;
    if(x.dataset.mp==='start'){if(host)start()}
    else if(x.dataset.mp==='rematch'){if(host){if(full&&full.over)start()}else send({t:'rematch'})}
    else if(x.dataset.act){let a;try{a=JSON.parse(x.dataset.act)}catch(er){return}host?hostAct(a):guestAct(a)}};
  main.onclick=h;main.oninput=main.onkeydown=null;
  cleanup=()=>{alive=false;main.onclick=null;try{dc.close();pc.close()}catch(e){}};
  draw();window.scrollTo(0,0);toast('Connected! 🎉')}

setTimeout(()=>{INFO.FAQ='Do I need an account? No. Is multiplayer live? Yes — use Direct connection to play with a friend on another device (you swap two codes by message), or room codes if shared storage is available. A dedicated Socket.IO server is the production path. Where is my progress saved? In this browser only.'},0);

/* ---------- multiplayer v3: short 6-letter codes via a public broker (PeerJS), with fallbacks ---------- */
let peerLibP=null;
function loadPeer(){if(window.Peer)return Promise.resolve(true);if(peerLibP)return peerLibP;
  peerLibP=new Promise(res=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
    s.onload=()=>res(!!window.Peer);s.onerror=()=>res(false);document.head.appendChild(s);setTimeout(()=>res(!!window.Peer),6000)}).then(ok=>{if(!ok)peerLibP=null;return ok});return peerLibP}
function mkShim(conn,peer){
  const dc={readyState:'open',onmessage:null,onclose:null,send:s=>{try{conn.send(s)}catch(e){}},close:()=>{try{conn.close()}catch(e){}}};
  const pc={connectionState:'connected',onconnectionstatechange:null,close:()=>{try{peer.destroy()}catch(e){}}};return{dc,pc}}

async function mpPeerHost(gk){
  if(!(await loadPeer()))return false;
  for(let n=0;n<3;n++){
    const code=mkCode();
    const r=await new Promise(res=>{let peer,done=false;
      try{peer=new Peer('nxp-'+code,{debug:0})}catch(e){return res({ok:false})}
      const t=setTimeout(()=>{if(done)return;done=true;try{peer.destroy()}catch(e){}res({ok:false,why:'timeout'})},7000);
      peer.on('open',()=>{if(done)return;done=true;clearTimeout(t);res({ok:true,peer,code})});
      peer.on('error',err=>{if(done)return;done=true;clearTimeout(t);try{peer.destroy()}catch(e){}res({ok:false,why:err&&err.type})})});
    if(r.ok)return mpPeerWait(gk,r.peer,r.code);
    if(r.why!=='unavailable-id')return false}
  return false}

function mpPeerWait(gk,peer,code){
  const G=MP[gk];let alive=true,used=false;
  cleanup=()=>{alive=false;main.onclick=main.oninput=main.onkeydown=null;try{peer.destroy()}catch(e){}};
  main.oninput=main.onkeydown=null;window.scrollTo(0,0);
  main.innerHTML=`<div class="gh"><button class="btn" data-mp="lobby">← Cancel</button><div class="sp"><h2>${G.name}</h2><span class="badge">Waiting for a friend</span></div></div>
  <div class="card pad empty" style="margin-top:14px"><span class="muted">Your room code</span><div style="font-size:clamp(34px,11vw,52px);font-weight:900;letter-spacing:.22em;margin:6px 0">${code}</div>
  <div class="row" style="justify-content:center"><button class="btn p" data-mp="copy">Copy code</button></div>
  <p class="muted" style="margin-top:10px">Ask your friend to open Multiplayer, type this code and tap Join. Keep this page open.</p></div>`;
  const h=e=>{if(main.onclick!==h)return;const x=e.target.closest('[data-mp]');if(!x)return;if(x.dataset.mp==='lobby')return go('multiplayer');if(x.dataset.mp==='copy')copyText(code)};
  main.onclick=h;
  peer.on('connection',conn=>{if(used){try{conn.close()}catch(e){}return}
    used=true;let got=false;const sh=mkShim(conn,peer);
    conn.on('open',()=>conn.send({t:'hello',g:gk,n:pname(),a:S.avatar}));
    conn.on('data',d=>{if(!got){if(d&&d.t==='hello'&&alive){got=true;alive=false;mpDirectPlay({host:true,gk,dc:sh.dc,pc:sh.pc,peer:{name:cleanP({name:d.n}).name,av:cleanP({av:d.a}).av}})}return}sh.dc.onmessage&&sh.dc.onmessage({data:d})});
    conn.on('close',()=>{if(!got)used=false;sh.dc.onclose&&sh.dc.onclose()});
    conn.on('error',()=>{if(!got)used=false;sh.dc.onclose&&sh.dc.onclose()})});
  peer.on('error',err=>{if(alive)toast('Connection problem: '+(err&&err.type||'unknown'))});
  return true}

function mpPeerJoin(code,say){
  return loadPeer().then(ok=>{if(!ok)return false;say('Connecting to '+code+'…');
    return new Promise(res=>{let peer,done=false;
      const fail=()=>{if(done)return;done=true;try{peer&&peer.destroy()}catch(e){}res(false)};
      try{peer=new Peer({debug:0})}catch(e){return res(false)}
      const t=setTimeout(fail,9000);peer.on('error',fail);
      peer.on('open',()=>{const conn=peer.connect('nxp-'+code,{serialization:'json',reliable:true}),sh=mkShim(conn,peer);let got=false;
        conn.on('error',fail);conn.on('open',()=>conn.send({t:'hello',n:pname(),a:S.avatar}));
        conn.on('data',d=>{if(!got){if(d&&d.t==='hello'&&MP[d.g]&&!done){got=true;done=true;clearTimeout(t);res(true);
          mpDirectPlay({host:false,gk:d.g,dc:sh.dc,pc:sh.pc,peer:{name:cleanP({name:d.n}).name,av:cleanP({av:d.a}).av}})}return}sh.dc.onmessage&&sh.dc.onmessage({data:d})});
        conn.on('close',()=>{sh.dc.onclose&&sh.dc.onclose()})})})})}

async function mpCreate(gk,say){
  if(!MP[gk])return;say('Creating game…');
  if(await mpPeerHost(gk))return;
  say('Online service unreachable — trying shared storage…');let code=null;
  for(let i=0;i<4;i++){const c=mkCode(),ex=await sget('room:'+c);if(!ex||ex.status==='closed'||Date.now()-ex.t>120000){code=c;break}}
  const room=code&&{code,game:gk,host:{id:pid(),name:pname(),av:S.avatar},guest:null,status:'waiting',state:null,v:0,t:Date.now()};
  if(!room||!(await sset('room:'+code,room))){toast('No online service reachable — using manual codes.');return mpDirectHost(gk)}
  await sset('room:'+code+':g',{guest:null,seq:0,act:null,hb:0});
  mpRoom({role:'host',code,gk,room})}

async function mpJoin(raw,say){
  const code=String(raw||'').trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(code))return say('Room codes are 6 letters/numbers.');
  say('Looking for the room…');
  const r=await sget('room:'+code);
  if(r&&r.status!=='closed'&&MP[r.game]){
    if(r.guest&&r.guest.id!==pid())return say('That room is already full.');
    const old=await sget('room:'+code+':g'),seq=old&&old.guest&&old.guest.id===pid()?(old.seq||0):0;
    if(!(await sset('room:'+code+':g',{guest:{id:pid(),name:pname(),av:S.avatar},seq,act:null,hb:Date.now()})))return say('Could not reach shared storage.');
    return mpRoom({role:'guest',code,gk:r.game,room:r,seq})}
  if(await mpPeerJoin(code,say))return;
  say('Room not found. Check the code, and make sure the host is waiting with the page open.')}

  const opts=Object.keys(MP).map(k=>`<option value="${k}">${MP[k].name}</option>`).join('');
  main.innerHTML=`<div class="sh"><div><h1 style="font-size:clamp(26px,5vw,36px)">Multiplayer</h1><p>Play with a friend on another device — or share one device.</p></div></div>
  <div class="card pad"><div class="ctl"><label>Your name <input id="mpn" maxlength="16" value="${esc(pname())}" aria-label="Your name" style="height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card);padding:0 10px;margin-left:6px;width:min(55vw,200px)"></label><span class="muted">${S.avatar} · Online record: ${rec.w}W · ${rec.l}L · ${rec.d}D</span></div></div>

  init(P,now){const s={rd:0,sc:P.map(()=>0),used:[]};odNew(s,P,now);return s},
  pub(s,i,now){const rev=s.ph==='rev'||s.ph==='end';return{ph:s.ph,rd:s.rd,n:3,ms:Math.max(0,s.until-now),w:i===s.odd?s.wo:s.wm,
    clues:s.ph==='clue'?Object.fromEntries(Object.keys(s.clues).map(k=>[k,1])):s.clues,voted:s.votes[i]!=null?s.votes[i]:null,nv:Object.keys(s.votes).length,sc:s.sc,
    ...(rev?{odd:s.odd,wm:s.wm,wo:s.wo,votes:s.votes,last:s.last}:{})}},
  act(s,i,a,now,P){if(!a||!P[i]||!P[i].on)return null;
    if(s.ph==='clue'&&a.t==='clue'){const c=String(a.v==null?'':a.v).trim().replace(/\s+/g,' ').slice(0,20);if(!c||s.clues[i]!=null)return null;s.clues[i]=c;
      if(onIds(P).every(k=>s.clues[k]!=null)){s.ph='vote';s.until=now+30000}return s}
    if(s.ph==='vote'&&a.t==='vote'){if(!Number.isInteger(a.to)||a.to===i||!P[a.to]||!P[a.to].on||s.votes[i]!=null)return null;s.votes[i]=a.to;if(onIds(P).every(k=>s.votes[k]!=null))odReveal(s,now);return s}
    return null},
  tick(s,now,P){
    if(s.ph==='clue'&&(now>=s.until||onIds(P).every(k=>s.clues[k]!=null))){onIds(P).forEach(k=>{if(s.clues[k]==null)s.clues[k]='—'});s.ph='vote';s.until=now+30000;return s}
    if(s.ph==='vote'&&(now>=s.until||onIds(P).every(k=>s.votes[k]!=null))){odReveal(s,now);return s}
    if(s.ph==='rev'&&now>=s.until){if(s.rd+1>=3)s.ph='end';else{s.rd++;odNew(s,P,now)}return s}
    return null},
  view(v,me,P){const on=P.filter(p=>p.on).length,cd=`<div class="ctl"><span class="score">Round ${v.rd+1}/${v.n}</span><span>⏱ <b id="cd">${Math.ceil(v.ms/1000)}</b>s</span></div>`;
    if(v.ph==='end'){const r=grpRank(v,P)[0];return`<div class="card pad empty"><div style="font-size:54px">🏆</div><h2>${esc(r.p.name)} wins!</h2></div>`+grpBoard(v,P,me)}
    if(v.ph==='clue'){const done=v.clues&&v.clues[me]!=null,n=Object.keys(v.clues||{}).length;
      return cd+`<div class="card pad empty"><span class="muted">Your secret word</span><div style="font-size:40px;font-weight:900;margin:6px 0">${esc(v.w)}</div>
      <p class="muted">One player has a different word. Give a one-word clue — without saying your word!</p>
      ${done?'<p class="msg">Clue sent ✓ — waiting for others…</p>':`<div class="row" style="justify-content:center"><input id="gw" maxlength="20" placeholder="One-word clue" autocomplete="off" style="${INP};width:min(100%,220px)"><button class="btn p" data-ga='{"t":"clue"}' data-gi="gw">Send</button></div>`}
      <p class="muted">${n}/${on} submitted</p></div>`+grpBoard(v,P,me)}
    if(v.ph==='vote')return cd+`<div class="card pad"><h3>Who has the different word?</h3><p class="muted">${v.nv}/${on} voted</p><div style="display:grid;gap:8px;margin-top:10px">${P.map((p,i)=>`<div class="ctl card pad" style="padding:10px"><span>${p.av} <b>${esc(p.name)}</b>: “${esc((v.clues&&v.clues[i])||'—')}”</span>${i!==me&&p.on&&v.voted==null?`<button class="btn p" data-ga='${JSON.stringify({t:'vote',to:i})}'>Vote</button>`:v.voted===i?'<span class="badge">your vote</span>':''}</div>`).join('')}</div></div>`+grpBoard(v,P,me);
    return`<div class="card pad empty"><h3>${v.last&&v.last.caught?'🎯 The odd one was caught!':'😈 The odd one escaped!'}</h3><p>${P[v.odd].av} <b>${esc(P[v.odd].name)}</b> had <b>${esc(v.wo)}</b> — everyone else had <b>${esc(v.wm)}</b>.</p></div>`+grpBoard(v,P,me)}};

function grpPage({G,v,me,P,started,code,isHost,dead}){
  const pl=P.map((p,i)=>`<div style="display:flex;align-items:center;gap:8px"><span style="font-size:22px">${p.av}</span><b>${esc(p.name)}</b><span class="muted">${i===0?'host':''}${i===me?' · you':''}</span><span style="width:9px;height:9px;border-radius:50%;display:inline-block;background:${p.on?'#22c55e':'#ef4444'}"></span></div>`).join('');
  let body;
  if(!started||!v){body=`<div class="card pad"><div class="ctl"><div><span class="muted">Room code</span><div style="font-size:34px;font-weight:900;letter-spacing:.2em">${esc(code||'······')}</div></div>${isHost?'<button class="btn" data-mp="gcopy">Copy code</button>':''}</div>
    <p class="muted" style="margin:8px 0">${G.how}</p><b>Players (${P.length}/${G.max})</b><div style="display:grid;gap:8px;margin-top:8px">${pl}</div>
    ${isHost?`<div class="row" style="padding-top:14px"><button class="btn p" data-mp="gstart" ${onIds(P).length<G.min?'disabled':''}>Start game</button><span class="muted">Needs ${G.min}+ players</span></div>`:'<p class="msg">Waiting for the host to start…</p>'}</div>`}
  else{try{body=G.view(v,me,P)}catch(e){body='<div class="card pad empty">Could not display the game.</div>'}
    if(isHost&&v.ph==='end')body+='<div class="row" style="justify-content:center"><button class="btn p" data-mp="gstart">Play again</button></div>'}
  return`<div class="gh"><button class="btn" data-mp="lobby">← Leave</button><div class="sp"><h2>${G.name}</h2><span class="badge">${P.length} players${dead?' · disconnected':''}</span></div></div>${dead?'<p class="msg" style="color:#ef4444">Connection lost. Go back and join again.</p>':''}<div class="stage" style="max-width:560px">${body}</div>`}

function peerOpen(code){return new Promise(res=>{let peer,done=false;try{peer=new Peer('nxp-'+code,{debug:0})}catch(e){return res({ok:false})}
  const t=setTimeout(()=>{if(done)return;done=true;try{peer.destroy()}catch(e){}res({ok:false,why:'timeout'})},7000);
  peer.on('open',()=>{if(done)return;done=true;clearTimeout(t);res({ok:true,peer})});
  peer.on('error',err=>{if(done)return;done=true;clearTimeout(t);try{peer.destroy()}catch(e){}res({ok:false,why:err&&err.type})})})}

function mpGroupHost(gk,peer,code){
  const G=GM[gk];let P=[{name:pname(),av:S.avatar,on:true}],conns={},st=null,started=false,alive=true,endAt=0;
  const meta=()=>P.map(p=>({name:p.name,av:p.av,on:p.on}));
  function draw(){if(!alive)return;const v=started?G.pub(st,0,Date.now()):null;endAt=v&&v.ms!=null?Date.now()+v.ms:0;keepInputs(()=>{main.innerHTML=grpPage({G,v,me:0,P,started,code,isHost:true,dead:false})})}
  function bc(){const now=Date.now();for(const k in conns){try{conns[k].send({t:'s',s:started?G.pub(st,+k,now):null,ps:meta(),st:started,me:+k,code,g:gk})}catch(e){}}draw()}
  function start(){if(onIds(P).length<G.min)return toast('Need at least '+G.min+' players.');st=G.init(P,Date.now());started=true;bc()}
  const cd=setInterval(()=>{const e=$('#cd');if(e&&endAt)e.textContent=Math.max(0,Math.ceil((endAt-Date.now())/1000))},250);
  const iv=setInterval(()=>{if(!alive||!started)return;const n=G.tick(st,Date.now(),P);if(n)bc()},300);
  cleanup=()=>{alive=false;clearInterval(iv);clearInterval(cd);main.onclick=main.oninput=main.onkeydown=null;for(const k in conns){try{conns[k].close()}catch(e){}}try{peer.destroy()}catch(e){}};
  peer.on('connection',conn=>{let id=-1;
    conn.on('open',()=>{try{conn.send({t:'hello',g:gk,grp:1,n:pname(),a:S.avatar})}catch(e){}});
    conn.on('data',d=>{if(!alive||!d)return;
      if(id<0){if(d.t==='hello'){if(started||P.length>=G.max){try{conn.send({t:'full'})}catch(e){}setTimeout(()=>{try{conn.close()}catch(e){}},400);return}
        id=P.length;P.push({name:cleanP({name:d.n}).name,av:cleanP({av:d.a}).av,on:true});conns[id]=conn;beep(600,.08);bc()}return}
      if(d.t==='a'&&started){const n=G.act(st,id,d.a,Date.now(),P);if(n)bc()}});
    const gone=()=>{if(id>=0&&P[id]&&P[id].on){P[id].on=false;delete conns[id];bc()}};
    conn.on('close',gone);conn.on('error',gone)});
  peer.on('error',err=>{if(alive)toast('Connection problem: '+(err&&err.type||'unknown'))});
  const h=e=>{if(main.onclick!==h)return;const x=e.target.closest('[data-mp],[data-ga]');if(!x)return;const m=x.dataset.mp;
    if(m==='lobby')return go('multiplayer');if(m==='gcopy')return copyText(code);if(m==='gstart')return start();
    if(x.dataset.ga&&started){let a;try{a=JSON.parse(x.dataset.ga)}catch(er){return}if(x.dataset.gi){const el=document.getElementById(x.dataset.gi);a.v=el?el.value:''}const n=G.act(st,0,a,Date.now(),P);if(n)bc()}};
  main.onclick=h;main.oninput=main.onkeydown=null;draw();window.scrollTo(0,0)}

function mpGroupGuest(gk,conn,peer,hello){
  const G=GM[gk];let v=null,P=[{name:cleanP({name:hello.n}).name,av:cleanP({av:hello.a}).av,on:true}],me=-1,started=false,alive=true,dead=false,code='',endAt=0;
  const cd=setInterval(()=>{const e=$('#cd');if(e&&endAt)e.textContent=Math.max(0,Math.ceil((endAt-Date.now())/1000))},250);
  cleanup=()=>{alive=false;clearInterval(cd);main.onclick=main.oninput=main.onkeydown=null;try{conn.close()}catch(e){}try{peer.destroy()}catch(e){}};
  function draw(){if(!alive)return;keepInputs(()=>{main.innerHTML=grpPage({G,v,me,P,started,code,isHost:false,dead})})}
  conn.on('data',d=>{if(!alive||!d)return;
    if(d.t==='s'){v=d.s;if(Array.isArray(d.ps))P=d.ps.slice(0,12).map(p=>({name:cleanP({name:p&&p.name}).name,av:cleanP({av:p&&p.av}).av,on:!!(p&&p.on)}));
      me=Number.isInteger(d.me)?d.me:me;started=!!d.st;code=String(d.code||'').slice(0,6);endAt=v&&v.ms!=null?Date.now()+v.ms:0;draw()}
    else if(d.t==='full'){alive=false;clearInterval(cd);main.innerHTML=dShell(G.name,'<p class="msg">This room is full or the game has already started.</p>')}});
  conn.on('close',()=>{if(alive){dead=true;draw()}});
  const h=e=>{if(main.onclick!==h)return;const x=e.target.closest('[data-mp],[data-ga]');if(!x)return;
    if(x.dataset.mp==='lobby')return go('multiplayer');if(dead)return;
    if(x.dataset.ga){let a;try{a=JSON.parse(x.dataset.ga)}catch(er){return}if(x.dataset.gi){const el=document.getElementById(x.dataset.gi);a.v=el?el.value:''}try{conn.send({t:'a',a})}catch(er){}}};
  main.onclick=h;main.oninput=main.onkeydown=null;draw();window.scrollTo(0,0);toast('Joined! 🎉')}

async function mpGroupCreate(gk,say){
  say('Creating group room…');
  if(!(await loadPeer()))return say('Group games need the online connection service (PeerJS), which could not load here. Try another network or browser.');
  for(let n=0;n<3;n++){const code=mkCode(),r=await peerOpen(code);if(r.ok)return mpGroupHost(gk,r.peer,code);if(r.why!=='unavailable-id')break}
  say('Could not reach the online service. Group games need it — try another network, or use Pass & play for two players.')}

/* join over PeerJS: handles both 2-player and group rooms */
function mpPeerJoin(code,say){
  return loadPeer().then(ok=>{if(!ok)return false;say('Connecting to '+code+'…');
    return new Promise(res=>{let peer,done=false,grp=false;
      const fail=()=>{if(done)return;done=true;try{peer&&peer.destroy()}catch(e){}res(false)};
      try{peer=new Peer({debug:0})}catch(e){return res(false)}
      const t=setTimeout(fail,9000);peer.on('error',fail);
      peer.on('open',()=>{const conn=peer.connect('nxp-'+code,{serialization:'json',reliable:true}),sh=mkShim(conn,peer);let got=false;
        conn.on('error',fail);conn.on('open',()=>conn.send({t:'hello',n:pname(),a:S.avatar}));
        conn.on('data',d=>{if(grp)return;
          if(!got){if(d&&d.t==='hello'&&!done&&(MP[d.g]||GM[d.g])){got=true;done=true;clearTimeout(t);res(true);
              if(GM[d.g]){grp=true;mpGroupGuest(d.g,conn,peer,d)}
              else mpDirectPlay({host:false,gk:d.g,dc:sh.dc,pc:sh.pc,peer:{name:cleanP({name:d.n}).name,av:cleanP({av:d.a}).av}})}return}
          sh.dc.onmessage&&sh.dc.onmessage({data:d})});
        conn.on('close',()=>{if(!grp)sh.dc.onclose&&sh.dc.onclose()})})})})}

async function mpCreate(gk,say){
  if(GM[gk])return mpGroupCreate(gk,say);
  if(!MP[gk])return;say('Creating game…');
  if(await mpPeerHost(gk))return;
  say('Online service unreachable — trying shared storage…');let code=null;
  for(let i=0;i<4;i++){const c=mkCode(),ex=await sget('room:'+c);if(!ex||ex.status==='closed'||Date.now()-ex.t>120000){code=c;break}}
  const room=code&&{code,game:gk,host:{id:pid(),name:pname(),av:S.avatar},guest:null,status:'waiting',state:null,v:0,t:Date.now()};
  if(!room||!(await sset('room:'+code,room))){toast('No online service reachable — using manual codes.');return mpDirectHost(gk)}
  await sset('room:'+code+':g',{guest:null,seq:0,act:null,hb:0});
  mpRoom({role:'host',code,gk,room})}

/* ---------- fallback when the online service is blocked: manual-code group rooms ---------- */
function rtcConn(dc){
  const H={data:[],close:[],open:[],error:[]};
  const c={on(e,f){(H[e]||(H[e]=[])).push(f);if(e==='open'&&dc.readyState==='open')setTimeout(f,0);return c},
    send(o){dc.send(JSON.stringify(o))},close(){try{dc.close()}catch(e){}}};
  dc.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}H.data.forEach(f=>f(m))};
  dc.onclose=()=>H.close.forEach(f=>f());
  dc.onerror=()=>H.error.forEach(f=>f());
  return c}

/* ---------- 6-digit rooms for group games over shared storage (no outside service needed) ---------- */
function peerOpen(code){return new Promise(res=>{let peer,done=false;try{peer=new Peer('nxp-'+code,{debug:0})}catch(e){return res({ok:false})}
  const t=setTimeout(()=>{if(done)return;done=true;try{peer.destroy()}catch(e){}res({ok:false,why:'timeout'})},4500);
  peer.on('open',()=>{if(done)return;done=true;clearTimeout(t);res({ok:true,peer})});
  peer.on('error',err=>{if(done)return;done=true;clearTimeout(t);try{peer.destroy()}catch(e){}res({ok:false,why:err&&err.type})})})}

function storeHostPeer(gk,code){
  const KR='grp:'+code,KA=KR+':a:',H={},vc={},stt={},gone={},views={};
  let v=0,alive=true,timer=null,flushT=null,busy=false,lastFlush=Date.now();
  async function flush(){if(!alive)return;v++;lastFlush=Date.now();await sset(KR,{g:gk,host:{name:pname(),av:S.avatar},views,v,t:Date.now()})}
  const sched=()=>{if(!flushT)flushT=setTimeout(()=>{flushT=null;flush()},120)};
  function mk(gid){
    const hs={data:[],close:[],open:[],error:[]};
    const c={on(e,f){(hs[e]||(hs[e]=[])).push(f);if(e==='open')setTimeout(f,0);return c},
      send(o){if(!o||o.t==='hello')return;views[gid]=o;sched()},
      close(){delete vc[gid]},
      emit(e,d){(hs[e]||[]).forEach(f=>f(d))}};
    return c}
  async function poll(){
    if(busy||!alive)return;busy=true;
    try{
      const L=await tmo(window.storage.list(KA,true),4000),keys=(L&&L.keys)||[],have={};
      for(const k of keys){const ks=String(k),gid=ks.startsWith(KA)?ks.slice(KA.length):ks,g=await sget(KA+gid);
        if(!g||g.left||!g.id)continue;have[gid]=1;
        if(!vc[gid]){if(gone[gid]!==undefined&&gone[gid]===g.hb)continue;
          const c=mk(gid);vc[gid]=c;stt[gid]={seq:g.seq||0,hb:g.hb,seen:Date.now()};delete gone[gid];
          if(H.connection){H.connection(c);setTimeout(()=>c.emit('data',{t:'hello',n:g.name,a:g.av}),0)}}
        else{const s=stt[gid];if(g.hb!==s.hb){s.hb=g.hb;s.seen=Date.now()}if(g.act&&g.seq>s.seq){s.seq=g.seq;vc[gid].emit('data',{t:'a',a:g.act})}}}
      for(const gid in vc){const s=stt[gid];if(!have[gid]||Date.now()-s.seen>25000){const c=vc[gid];gone[gid]=s.hb;delete vc[gid];delete views[gid];c.emit('close')}}
    }catch(e){}
    busy=false;
    if(alive&&Date.now()-lastFlush>8000)sched()}
  return{on(e,f){H[e]=f},
    start(){timer=setInterval(poll,1400);poll()},
    destroy(){if(!alive)return;alive=false;clearInterval(timer);clearTimeout(flushT);
      (async()=>{await sset(KR,{g:gk,closed:true,views:{},v:v+1,t:Date.now()});try{await window.storage.delete(KR,true)}catch(e){}})()}}}

function storeGuestConn(code){
  const KR='grp:'+code,id=pid(),KA=KR+':a:'+id,H={data:[],close:[],open:[],error:[]};
  let seq=0,act=null,alive=true,lastV=-1,seenT=null,seenAt=Date.now(),timer=null,hbAt=0,busy=false;
  const emit=(e,d)=>(H[e]||[]).forEach(f=>f(d));
  const writeA=()=>{hbAt=Date.now();return sset(KA,{id,name:pname(),av:S.avatar,seq,act,hb:Date.now()})};
  function stop(){alive=false;clearInterval(timer)}
  async function poll(){
    if(busy||!alive)return;busy=true;
    try{const r=await sget(KR);if(!alive){busy=false;return}
      if(!r||r.closed){stop();emit('close');busy=false;return}
      if(r.t!==seenT){seenT=r.t;seenAt=Date.now()}
      if(r.v!==lastV){lastV=r.v;const m=r.views&&r.views[id];if(m)emit('data',m)}
      if(Date.now()-seenAt>25000){stop();emit('close');busy=false;return}
      if(Date.now()-hbAt>8000)await writeA()}catch(e){}
    busy=false}
  const c={on(e,f){(H[e]||(H[e]=[])).push(f);if(e==='open')setTimeout(f,0);return c},
    send(o){if(!alive||!o||o.t!=='a')return;seq++;act=o.a;writeA()},
    close(){if(!alive)return;stop();sset(KA,{id,left:true,seq,act:null,hb:0});try{window.storage.delete(KA,true)}catch(e){}},
    join:()=>writeA(),
    start(){timer=setInterval(poll,1300);poll()}};
  return c}

async function mpStoreJoin(code,say,r0){
  const r=r0||await sget('grp:'+code);
  if(!r||r.closed||!GM[r.g]||Date.now()-r.t>300000)return false;
  const conn=storeGuestConn(code);say('Joining…');
  if(!(await conn.join()))return false;
  mpGroupGuest(r.g,conn,{destroy(){conn.close()}},{n:cleanP({name:r.host&&r.host.name}).name,a:cleanP({av:r.host&&r.host.av}).av});
  conn.start();return true}

async function mpGroupCreate(gk,say){
  say('Creating room…');
  if(!window.__peerBad){
    if(await loadPeer()){const c0=mkCode(),r=await peerOpen(c0);if(r.ok)return mpGroupHost(gk,r.peer,c0);window.__peerBad=true}else window.__peerBad=true}
  let code=null;
  for(let i=0;i<4;i++){const c=mkCode(),ex=await sget('grp:'+c);if(!ex||ex.closed||Date.now()-ex.t>300000){code=c;break}}
  if(code&&await sset('grp:'+code,{g:gk,host:{name:pname(),av:S.avatar},views:{},v:0,t:Date.now()})){
    const peer=storeHostPeer(gk,code);mpGroupHost(gk,peer,code);peer.start();return}
  toast('Shared storage is not available either — using manual codes for this group.');
  return mpGroupHostManual(gk)}

async function mpJoin(raw,say){

    if(!(await sset('room:'+code+':g',{guest:{id:pid(),name:pname(),av:S.avatar},seq,act:null,hb:Date.now()})))return say('Could not reach shared storage.');

    P.forEach((p,i)=>{p.id=i;p.col=COLORS[i];p.wins=0;p.kos=0});
    round=0;winner=-1;paused=false;
    el.innerHTML=`<div id="ro-hud" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"></div><canvas id="ro-cv" style="max-width:520px"></canvas><p class="msg" id="ro-msg" role="status"></p>
    ${touch?'<div class="ro-ctl"><div id="ro-joy"><i id="ro-nub"></i></div><button class="btn p" id="ro-dash">DASH</button></div>':''}
    <div class="row" style="justify-content:center"><button class="btn" id="ro-pz">Pause</button><button class="btn" id="ro-quit">Quit</button></div>`;
    cv=$('#ro-cv',el);W=Math.min(el.clientWidth||360,520);cv.width=cv.height=W;sc=W/1000;cx=cv.getContext('2d');
    if(touch){const j=$('#ro-joy',el),n=$('#ro-nub',el);let act=false;
      const mv=e=>{const r=j.getBoundingClientRect();let dx=(e.clientX-(r.left+r.width/2))/55,dy=(e.clientY-(r.top+r.height/2))/55;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=dy;n.style.left=(45+dx*45)+'px';n.style.top=(45+dy*45)+'px'};
      const up=()=>{act=false;joy.x=joy.y=0;n.style.left='45px';n.style.top='45px'};
      j.addEventListener('pointerdown',e=>{act=true;try{j.setPointerCapture(e.pointerId)}catch(er){}mv(e)});
      j.addEventListener('pointermove',e=>{if(act)mv(e)});j.addEventListener('pointerup',up);j.addEventListener('pointercancel',up);
      $('#ro-dash',el).addEventListener('pointerdown',e=>{e.preventDefault();if(P[0]&&P[0].human)P[0].dashReq=true})}
    newRound();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}

  function renderHud(){const h=$('#ro-hud',el);if(!h)return;
    h.innerHTML=P.map(p=>`<span class="badge" style="border-color:${p.col};display:inline-flex;gap:6px;align-items:center"><i style="width:10px;height:10px;border-radius:50%;background:${p.col};display:inline-block"></i>${p.name} · ${p.wins}</span>`).join('')+`<span class="badge">Round ${round} · first to ${cfg.win}</span>`}

  function newRound(){round++;const n=P.length;
    P.forEach((p,i)=>{const a=i/n*Math.PI*2-Math.PI/2;p.x=CX+Math.cos(a)*270;p.y=CY+Math.sin(a)*270;p.vx=p.vy=0;p.alive=true;p.falling=false;p.fall=0;p.cd=0;p.dashT=0;p.dashReq=false;p.fx=-Math.cos(a);p.fy=-Math.sin(a);p.hit=null;p.hitT=0});
    t=0;Rcur=R0;state='cd';tcount=3;goT=0;const m=$('#ro-msg',el);if(m)m.textContent='';renderHud()}

  function bot(p,dt){
    const dc=Math.hypot(p.x-CX,p.y-CY);let ix=0,iy=0,tgt=null,bd=1e9;
    for(const q of P){if(q===p||!q.alive||q.falling)continue;const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;tgt=q}}
    if(dc>Rcur*0.7){ix=CX-p.x;iy=CY-p.y;if(dc>Rcur*0.88&&p.cd<=0&&Math.random()<dt*4){const l0=Math.hypot(ix,iy)||1;p.fx=ix/l0;p.fy=iy/l0;p.dashReq=true}}
    else if(tgt){const tx=tgt.x-CX,ty=tgt.y-CY,tl=Math.hypot(tx,ty)||1;ix=tgt.x-tx/tl*50-p.x;iy=tgt.y-ty/tl*50-p.y;
      if(bd<120&&p.cd<=0&&Math.random()<dt*2.5*p.skill){p.fx=(tgt.x-p.x)/bd;p.fy=(tgt.y-p.y)/bd;p.dashReq=true}}
    const l=Math.hypot(ix,iy)||1;ix/=l;iy/=l;p.wob=(p.wob||0)+dt;
    ix+=Math.sin(p.wob*3+p.id)*.25*(1-p.skill);iy+=Math.cos(p.wob*2+p.id)*.25*(1-p.skill);
    return[ix,iy]}

  function control(dt){
    for(const p of P){if(!p.alive||p.falling)continue;let ix=0,iy=0;
      if(p.human){const m=KM[p.key];if(down[m.l])ix--;if(down[m.r])ix++;if(down[m.u])iy--;if(down[m.d])iy++;if(p.key===0&&touch){ix+=joy.x;iy+=joy.y}}
      else{const v=bot(p,dt);ix=v[0];iy=v[1]}
      const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}
      p.vx+=ix*ACC*dt;p.vy+=iy*ACC*dt;
      if(l>0.15){p.fx+=(ix/l-p.fx)*Math.min(1,dt*14);p.fy+=(iy/l-p.fy)*Math.min(1,dt*14);const fl=Math.hypot(p.fx,p.fy)||1;p.fx/=fl;p.fy/=fl}
      p.cd=Math.max(0,p.cd-dt);p.dashT=Math.max(0,p.dashT-dt);
      if(p.dashReq){p.dashReq=false;if(p.cd<=0){p.vx+=p.fx*DASH;p.vy+=p.fy*DASH;p.cd=1.5;p.dashT=.28;ctx.beep(520,.05)}}}}

  function physics(dt){
    const dmp=Math.exp(-3.2*dt);
    for(const p of P){if(!p.alive)continue;p.vx*=dmp;p.vy*=dmp;p.x+=p.vx*dt;p.y+=p.vy*dt;p.hitT=Math.max(0,p.hitT-dt)}
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];if(!a.alive||!b.alive||a.falling||b.falling)continue;
      let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy);if(d>=PR*2||d===0)continue;
      const nx=dx/d,ny=dy/d,ov=(PR*2-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      const rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(rv>0){const imp=rv*.95+40;a.vx-=nx*imp;a.vy-=ny*imp;b.vx+=nx*imp;b.vy+=ny*imp;if(rv>250)ctx.beep(210,.05)}
      if(a.dashT>0){b.vx+=nx*KICK;b.vy+=ny*KICK;a.vx-=nx*KICK*.3;a.vy-=ny*KICK*.3}
      if(b.dashT>0){a.vx-=nx*KICK;a.vy-=ny*KICK;b.vx+=nx*KICK*.3;b.vy+=ny*KICK*.3}
      a.hit=b.id;a.hitT=2.5;b.hit=a.id;b.hitT=2.5}
    for(const p of P){if(!p.alive)continue;
      if(!p.falling){if(Math.hypot(p.x-CX,p.y-CY)>Rcur+PR*.4){p.falling=true;p.fall=0;if(p.hit!=null&&p.hitT>0&&P[p.hit].alive&&!P[p.hit].falling)P[p.hit].kos++;ctx.beep(160,.25)}}
      else{p.fall+=dt/.7;if(p.fall>=1)p.alive=false}}}

  function update(dt){
    if(state==='cd'){tcount-=dt;if(tcount<=0){state='play';t=0;goT=.7}return}
    if(state==='end'){physics(dt);endT-=dt;if(endT<=0)afterRound();return}
    if(state!=='play')return;
    t+=dt;goT=Math.max(0,goT-dt);Rcur=Math.max(110,R0-Math.max(0,t-4)*17);
    control(dt);physics(dt);
    const live=P.filter(p=>p.alive&&!p.falling);
    if(live.length<=1){state='end';endT=2.4;winner=live.length?live[0].id:-1;if(winner>=0)P[winner].wins++;renderHud();ctx.beep(winner>=0?700:200,.2)}}

  function afterRound(){const m=P.find(p=>p.wins>=cfg.win);
    if(!m){newRound();return}
    state='over';winner=m.id;
    const score=P[0].wins*100+P[0].kos*20;
    if(m.id===0)ctx.rec('win',score);else if(!m.human)ctx.rec('loss',score);else ctx.rec('play',score);
    renderHud();const msg=$('#ro-msg',el);if(msg)msg.innerHTML=`🏆 ${m.name} wins the match! <button class="btn p" id="ro-again">Play again</button>`}

  function draw(){
    const s=sc;cx.clearRect(0,0,W,W);
    const g=cx.createLinearGradient(0,0,0,W);g.addColorStop(0,'#0b1030');g.addColorStop(1,'#1a0f3a');cx.fillStyle=g;cx.fillRect(0,0,W,W);
    cx.beginPath();cx.arc(CX*s,CY*s,R0*s,0,7);cx.strokeStyle='rgba(255,255,255,.08)';cx.lineWidth=2;cx.stroke();
    const rg=cx.createRadialGradient(CX*s,CY*s,10,CX*s,CY*s,Math.max(10,Rcur*s));rg.addColorStop(0,'#3b3585');rg.addColorStop(1,'#241f66');
    cx.beginPath();cx.arc(CX*s,CY*s,Rcur*s,0,7);cx.fillStyle=rg;cx.fill();cx.lineWidth=5;cx.strokeStyle=(state==='play'&&t>4)?'#f43f8e':'#22d3ee';cx.stroke();
    for(const p of P){if(!p.alive)continue;
      const sf=p.falling?Math.max(.2,1-p.fall*.8):1,r=PR*s*sf;cx.globalAlpha=p.falling?Math.max(0,1-p.fall):1;
      const px=p.x*s,py=p.y*s;
      cx.beginPath();cx.arc(px,py+r*.25,r,0,7);cx.fillStyle='rgba(0,0,0,.3)';cx.fill();
      cx.beginPath();cx.arc(px,py,r,0,7);cx.fillStyle=p.col;cx.fill();cx.lineWidth=p.human?3:1.5;cx.strokeStyle=p.human?'#fff':'rgba(0,0,0,.45)';cx.stroke();
      const ex=p.fx,ey=p.fy,qx=-ey,qy=ex;
      for(const sd of[-1,1]){const ox=px+ex*r*.35+qx*sd*r*.35,oy=py+ey*r*.35+qy*sd*r*.35;cx.beginPath();cx.arc(ox,oy,r*.27,0,7);cx.fillStyle='#fff';cx.fill();cx.beginPath();cx.arc(ox+ex*r*.09,oy+ey*r*.09,r*.12,0,7);cx.fillStyle='#111';cx.fill()}
      if(!p.falling){cx.beginPath();if(p.cd>0)cx.arc(px,py,r+5*s,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-p.cd/1.5));else cx.arc(px,py,r+5*s,0,7);cx.strokeStyle=p.cd>0?'rgba(255,255,255,.7)':'rgba(163,230,53,.7)';cx.lineWidth=2.5;cx.stroke();
        cx.fillStyle='#fff';cx.font='bold '+Math.max(9,11*s*2)+'px system-ui';cx.textAlign='center';cx.fillText(p.human?p.name:'BOT',px,py-r-8*s)}
      cx.globalAlpha=1}
    cx.textAlign='center';cx.fillStyle='#fff';cx.shadowColor='rgba(0,0,0,.6)';cx.shadowBlur=8;
    if(paused){cx.font='bold '+80*s+'px system-ui';cx.fillText('Paused',W/2,W/2)}
    else if(state==='cd'){cx.font='bold '+150*s+'px system-ui';cx.fillText(String(Math.max(1,Math.ceil(tcount))),W/2,W/2+50*s)}
    else if(state==='play'&&goT>0){cx.font='bold '+110*s+'px system-ui';cx.fillText('GO!',W/2,W/2+40*s)}
    else if(state==='end'){cx.font='bold '+60*s+'px system-ui';cx.fillText(winner>=0?P[winner].name+' wins the round!':'Draw!',W/2,W/2)}

  function frame(ts){raf=requestAnimationFrame(frame);const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
    if(state==='setup')return;if(!paused)update(dt);draw()}

  const norm=e=>e.key.length===1?e.key.toLowerCase():e.key;
  const kd=e=>{if(state==='setup'||!cv)return;if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;const k=norm(e);let used=false;
    KM.forEach((m,i)=>{if(i>=cfg.humans)return;if(k===m.u||k===m.d||k===m.l||k===m.r){down[k]=true;used=true}if(k===m.x){used=true;if(!e.repeat&&P[i]&&P[i].human)P[i].dashReq=true}});

  const vis=()=>{if(document.hidden&&state!=='setup'&&state!=='over'&&!paused){paused=true;const b=$('#ro-pz',el);if(b)b.textContent='Resume'}};
  document.addEventListener('keydown',kd);document.addEventListener('keyup',ku);document.addEventListener('visibilitychange',vis);

  el.onclick=e=>{const x=e.target.closest('button');if(!x)return;
    if(x.id==='ro-go')startMatch();
    else if(x.id==='ro-pz'){if(state!=='over'){paused=!paused;x.textContent=paused?'Resume':'Pause'}x.blur()}
    else if(x.id==='ro-quit'){setup()}
    else if(x.id==='ro-again'){startMatch()}};
  setup();
  return()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',kd);document.removeEventListener('keyup',ku);document.removeEventListener('visibilitychange',vis)}}

/* ---------- Ring Out LIVE: real-time online brawl over WebRTC (6-digit code via shared storage, manual codes as backup) ---------- */
GM.ringout={name:'Ring Out (live)',glyph:'🥊',meta:'Real-time arena brawl',grad:'linear-gradient(135deg,#f43f8e,#8b5cf6,#22d3ee)',min:2,max:8,
  how:'A live arena brawl: shove rivals off a shrinking platform. Friends join from their own phones or computers with the 6-digit code; bots can fill empty spots.'};
const roOpt=(arr,cur)=>arr.map(n=>`<option value="${n}" ${n===cur?'selected':''}>${n}</option>`).join('');
let rtAddEl=null;
function rtCloseAdd(){if(rtAddEl){rtAddEl.remove();rtAddEl=null}}

function rtSignalHost(code,onLink){
  const KR='grp:'+code,KO=KR+':o:',KA=KR+':r:',seen={},pcs=[];let alive=true,busy=false,timer=null,hb=null;
  async function offer(gid,o){try{const pc=new RTCPeerConnection(RTC_CFG);pcs.push(pc);
    pc.ondatachannel=ev=>{const dc=ev.channel,go=()=>{if(alive)onLink(rtcConn(dc),{name:cleanP({name:o.n}).name,av:cleanP({av:o.a}).av})};if(dc.readyState==='open')go();else dc.onopen=go};
    await pc.setRemoteDescription({type:'offer',sdp:o.s});await pc.setLocalDescription(await pc.createAnswer());await iceDone(pc);
    await sset(KA+gid,{s:pc.localDescription.sdp})}catch(e){}}
  async function poll(){if(busy||!alive)return;busy=true;
    try{const L=await tmo(window.storage.list(KO,true),4000),keys=(L&&L.keys)||[];
      for(const k of keys){const ks=String(k),gid=ks.startsWith(KO)?ks.slice(KO.length):ks;if(seen[gid])continue;
        const o=await sget(KO+gid);if(!o||typeof o.s!=='string'||o.s.length>20000)continue;seen[gid]=1;offer(gid,o)}}catch(e){}
    busy=false}
  return{start(){timer=setInterval(poll,1100);hb=setInterval(()=>{sset(KR,{g:'ringout',host:{name:pname(),av:S.avatar},views:{},v:0,t:Date.now()})},20000);poll()},
    stop(){alive=false;clearInterval(timer);clearInterval(hb);pcs.forEach(p=>{try{p.close()}catch(e){}});try{window.storage.delete(KR,true)}catch(e){}}}}

async function rtJoin(code,say,r0){
  if(!window.RTCPeerConnection){say('This browser does not support real-time connections.');return true}
  const r=r0||await sget('grp:'+code);if(!r||r.closed||r.g!=='ringout')return false;
  say('Connecting… this can take a few seconds');
  const KO='grp:'+code+':o:',KA='grp:'+code+':r:',gid=pid();let pc,dc;
  try{pc=new RTCPeerConnection(RTC_CFG);dc=pc.createDataChannel('g')}catch(e){say('Could not start a real-time connection here.');return true}
  try{await pc.setLocalDescription(await pc.createOffer());await iceDone(pc)}catch(e){say('Could not prepare the connection.');return true}
  if(!(await sset(KO+gid,{n:pname(),a:S.avatar,s:pc.localDescription.sdp}))){try{pc.close()}catch(e){}return false}
  let opened=false,gotAns=false;const t0=Date.now();dc.onopen=()=>{opened=true};
  while(Date.now()-t0<45000&&!opened){
    if(!gotAns){const a=await sget(KA+gid);if(a&&typeof a.s==='string'){gotAns=true;try{await pc.setRemoteDescription({type:'answer',sdp:a.s})}catch(e){}}}
    await new Promise(res=>setTimeout(res,800))}
  try{window.storage.delete(KO+gid,true);window.storage.delete(KA+gid,true)}catch(e){}
  if(!opened){try{pc.close()}catch(e){}say('Could not connect. Try again, or ask the host to use "Add a player (manual code)".');return true}
  ringNet({host:false,code,link:rtcConn(dc),pc,hostInfo:{name:cleanP({name:r.host&&r.host.name}).name,av:cleanP({av:r.host&&r.host.av}).av}});
  return true}

function rtManualAdd(onLink){
  if(!window.RTCPeerConnection)return toast('Direct connection isn\'t supported in this browser.');
  rtCloseAdd();
  let pc,dc;try{pc=new RTCPeerConnection(RTC_CFG);dc=pc.createDataChannel('g')}catch(e){return toast('Could not start a direct connection here.')}
  const el=document.createElement('div');rtAddEl=el;
  el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:grid;place-items:center;padding:16px';
  el.innerHTML='<div class="card pad" style="max-width:560px;width:100%;max-height:90vh;overflow:auto;background:var(--bg2)"><h3>Add a player</h3><p class="muted" id="gast">Creating invite code…</p><div id="gabody"></div><div class="row"><button class="btn" id="gacl">Close</button></div></div>';
  document.body.appendChild(el);
  const st=m=>{const e=el.querySelector('#gast');if(e)e.textContent=m};let peer={name:'Friend',av:'🎮'};
  el.querySelector('#gacl').onclick=()=>{if(rtAddEl===el)rtCloseAdd()};
  dc.onopen=()=>{if(rtAddEl===el)rtCloseAdd();onLink(rtcConn(dc),peer)};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')st('Could not connect — try both devices on the same Wi-Fi.')};
  (async()=>{try{await pc.setLocalDescription(await pc.createOffer());await iceDone(pc);
    const code=b64e({g:'ringout',grp:1,n:pname(),a:S.avatar,s:pc.localDescription.sdp});
    el.querySelector('#gabody').innerHTML=`<p><b>Step 1</b> — send this invite code to the player:</p><textarea id="dout" readonly onfocus="this.select()" style="${TA}">${code}</textarea><div class="row"><button class="btn p" id="gacp">Copy invite code</button></div><p style="margin-top:12px"><b>Step 2</b> — paste the reply code they send back:</p><textarea id="gin" style="${TA}" placeholder="Paste reply code here"></textarea><div class="row"><button class="btn p" id="gaap">Connect</button></div>`;
    st('Waiting for the player…');
    el.querySelector('#gacp').onclick=()=>copyText(code);
    el.querySelector('#gaap').onclick=async()=>{try{const r=b64d(el.querySelector('#gin').value);if(typeof r.s!=='string'||r.s.length>20000)throw 0;peer={name:cleanP({name:r.n}).name,av:cleanP({av:r.a}).av};st('Connecting…');await pc.setRemoteDescription({type:'answer',sdp:r.s})}catch(er){st('That reply code isn\'t valid. Paste the whole code.')}}}
  catch(er){st('Could not create an invite code on this network.')}})()}

async function rtCreate(say){
  if(!window.RTCPeerConnection)return say('This browser does not support real-time connections.');
  say('Creating room…');let code=null;
  for(let i=0;i<4;i++){const c=mkCode(),ex=await sget('grp:'+c);if(!ex||ex.closed||Date.now()-ex.t>300000){code=c;break}}
  let ok=false;if(code)ok=await sset('grp:'+code,{g:'ringout',host:{name:pname(),av:S.avatar},views:{},v:0,t:Date.now()});
  if(!ok){toast('Shared storage unavailable — use "Add a player (manual code)" to connect friends.');code=''}
  const o={host:true,code,manualAdd:rtManualAdd};
  if(code)o.sig=rtSignalHost(code,(c,info)=>{if(o.addLink)o.addLink(c,info)});
  ringNet(o);if(o.sig)o.sig.start()}

function ringNet(o){
  const host=!!o.host,code=o.code||'';
  const COLORS=['#f43f8e','#22d3ee','#a3e635','#f59e0b','#8b5cf6','#ef4444','#38bdf8','#fb7185'];
  const CX=500,CY=500,R0=440,PR=28,ACC=1500,DASH=820,KICK=420;
  const touch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||'ontouchstart' in window;
  const hi=o.hostInfo||{name:'Host',av:'🎮'};
  let P=host?[{id:0,name:pname(),av:S.avatar,human:true,local:true,on:true}]:[{id:0,name:hi.name,av:hi.av,human:true,on:true}];
  let state='lobby',tcount=0,t=0,round=0,Rcur=R0,goT=0,winner=-1,endT=0,alive=true,raf=0,last=0,lastSend=0,you=host?0:-1,dead=false,counted=false,shown=false,lastIn='',sentAt=0,hudKey='',hiAt=0,cv=null,cx=null,W=360,sc=.36,lt=0;
  const cfg={bots:2,win:3},joy={x:0,y:0},down={};
  const send=(l,m)=>{try{l.send(m)}catch(e){}};
  main.innerHTML=`<div class="gh"><button class="btn" data-mp="lobby">← Leave</button><div class="sp"><h2>Ring Out · Live</h2><span class="badge">${host?'Hosting':'Joined'}</span></div></div>
  <div class="stage" style="max-width:560px"><div id="rn-lobby"></div><div id="rn-game" hidden>
  <div id="rn-hud" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"></div><canvas id="rn-cv" style="max-width:520px"></canvas><p class="msg" id="rn-msg" role="status"></p>
  ${touch?'<div class="ro-ctl"><div id="ro-joy"><i id="ro-nub"></i></div><button class="btn p" id="ro-dash">DASH</button></div>':''}</div></div>`;

async function mpGroupCreate(gk,say){
  if(gk==='ringout')return rtCreate(say);
  say('Creating room…');
  if(!window.__peerBad){
    if(await loadPeer()){const c0=mkCode(),r=await peerOpen(c0);if(r.ok)return mpGroupHost(gk,r.peer,c0);window.__peerBad=true}else window.__peerBad=true}
  let code=null;
  for(let i=0;i<4;i++){const c=mkCode(),ex=await sget('grp:'+c);if(!ex||ex.closed||Date.now()-ex.t>300000){code=c;break}}
  if(code&&await sset('grp:'+code,{g:gk,host:{name:pname(),av:S.avatar},views:{},v:0,t:Date.now()})){
    const peer=storeHostPeer(gk,code);mpGroupHost(gk,peer,code);peer.start();return}
  toast('Shared storage is not available either — using manual codes for this group.');
  return mpGroupHostManual(gk)}

async function mpStoreJoin(code,say,r0){
  const r=r0||await sget('grp:'+code);
  if(r&&r.g==='ringout')return rtJoin(code,say,r);
  if(!r||r.closed||!GM[r.g]||Date.now()-r.t>300000)return false;
  const conn=storeGuestConn(code);say('Joining…');
  if(!(await conn.join()))return false;
  mpGroupGuest(r.g,conn,{destroy(){conn.close()}},{n:cleanP({name:r.host&&r.host.name}).name,a:cleanP({av:r.host&&r.host.av}).av});

let relayP=null;
function loadRelay(){
  if(window.__relaySock)return Promise.resolve(window.__relaySock);
  if(window.__relayBad||!/^https?:$/.test(location.protocol))return Promise.resolve(null);
  if(relayP)return relayP;
  relayP=new Promise(res=>{
    const bad=()=>{window.__relayBad=true;res(null)};
    const s=document.createElement('script');s.src='/socket.io/socket.io.js';s.onerror=bad;
    s.onload=()=>{try{const sock=io();let done=false;
      sock.on('connect',()=>{if(done)return;done=true;window.__relaySock=sock;res(sock)});
      sock.on('connect_error',()=>{if(!done){done=true;try{sock.close()}catch(e){}bad()}});
      setTimeout(()=>{if(!done){done=true;bad()}},4000)}catch(e){bad()}};
    document.head.appendChild(s)});
  return relayP}

function mkRelayConn(sock,code,pid,isHost){
  const H={data:[],close:[],open:[],error:[]};let closed=false;
  const c={on(e,f){(H[e]||(H[e]=[])).push(f);if(e==='open')setTimeout(f,0);return c},
    send(d){if(closed)return;if(isHost)sock.emit('to:guest',{code,pid,d});else sock.emit('to:host',{code,d})},
    close(){if(closed)return;closed=true;if(!isHost)sock.emit('room:leave',{code})},
    _in(d){H.data.forEach(f=>f(d))},
    _close(){if(closed)return;closed=true;H.close.forEach(f=>f())}};
  return c}

function relayHostRoom(sock,gk,onLink){
  return new Promise(res=>{
    sock.emit('room:create',{g:gk,n:pname(),a:S.avatar},ack=>{
      if(!ack||!ack.code)return res(null);
      const code=ack.code,links={};
      const j=m=>{if(!m||m.code!==code)return;const c=mkRelayConn(sock,code,m.pid,true);links[m.pid]=c;onLink(c,{name:cleanP({name:m.n}).name,av:cleanP({av:m.a}).av})};
      const d=m=>{if(!m||m.code!==code)return;const c=links[m.pid];if(c)c._in(m.d)};
      const l=m=>{if(!m||m.code!==code)return;const c=links[m.pid];if(c){delete links[m.pid];c._close()}};
      sock.on('peer:join',j);sock.on('peer:data',d);sock.on('peer:leave',l);
      res({code,stop(){sock.off('peer:join',j);sock.off('peer:data',d);sock.off('peer:leave',l);sock.emit('room:close',{code})}})});
    setTimeout(()=>res(null),6000)})}

function relayJoinRoom(sock,code){
  return new Promise(res=>{
    sock.emit('room:join',{code,n:pname(),a:S.avatar},ack=>{
      if(!ack||!ack.ok)return res(null);
      const c=mkRelayConn(sock,code,null,false);
      sock.on('host:data',m=>{if(m&&m.code===code)c._in(m.d)});
      sock.on('host:left',m=>{if(m&&m.code===code)c._close()});
      res({conn:c,g:ack.g,host:ack.host})});
    setTimeout(()=>res(null),6000)})}

async function relayCreateAny(sock,gk,say){
  let onLink=null;
  const r=await relayHostRoom(sock,gk,(c,info)=>{if(onLink)onLink(c,info)});
  if(!r)return say('Could not create a room on the server. Try again.');
  if(gk==='ringout'){const o={host:true,code:r.code,sig:{stop:r.stop}};ringNet(o);onLink=(c,info)=>{if(o.addLink)o.addLink(c,info)};return}
  const H={},fake={on(e,f){H[e]=f},destroy(){r.stop()}};
  if(GM[gk])mpGroupHost(gk,fake,r.code);else mpPeerWait(gk,fake,r.code);
  onLink=c=>{if(H.connection)H.connection(c)}}

async function relayJoinAny(sock,code){
  const r=await relayJoinRoom(sock,code);if(!r)return false;
  const conn=r.conn,g=r.g,hn=cleanP({name:r.host&&r.host.n}).name,ha=cleanP({av:r.host&&r.host.a}).av;
  const leave={destroy(){try{conn.close()}catch(e){}}};
  if(g==='ringout'){ringNet({host:false,code,link:conn,pc:{close(){try{conn.close()}catch(e){}}},hostInfo:{name:hn,av:ha}});return true}
  if(GM[g]){conn.send({t:'hello',n:pname(),a:S.avatar});mpGroupGuest(g,conn,leave,{n:hn,a:ha});return true}
  if(MP[g]){const sh=mkShim(conn,leave);
    conn.on('data',d=>{sh.dc.onmessage&&sh.dc.onmessage({data:d})});conn.on('close',()=>{sh.dc.onclose&&sh.dc.onclose()});
    conn.send({t:'hello',n:pname(),a:S.avatar});
    mpDirectPlay({host:false,gk:g,dc:sh.dc,pc:sh.pc,peer:{name:hn,av:ha}});return true}
  return false}

async function mpCreate(gk,say){
  if(!MP[gk]&&!GM[gk])return;
  say('Creating room…');
  const sock=await loadRelay();
  if(sock)return relayCreateAny(sock,gk,say);
  if(GM[gk])return mpGroupCreate(gk,say);
  if(await mpPeerHost(gk))return;
  say('Online service unreachable — trying shared storage…');let code=null;
  for(let i=0;i<4;i++){const c=mkCode(),ex=await sget('room:'+c);if(!ex||ex.status==='closed'||Date.now()-ex.t>120000){code=c;break}}
  const room=code&&{code,game:gk,host:{id:pid(),name:pname(),av:S.avatar},guest:null,status:'waiting',state:null,v:0,t:Date.now()};
  if(!room||!(await sset('room:'+code,room))){toast('No online service reachable — using manual codes.');return mpDirectHost(gk)}
  await sset('room:'+code+':g',{guest:null,seq:0,act:null,hb:0});
  mpRoom({role:'host',code,gk,room})}

async function mpJoin(raw,say){
  const code=String(raw||'').replace(/\D/g,'');if(code.length!==6)return say('Enter the 6-digit room code.');
  say('Looking for the room…');
  const sock=await loadRelay();
  if(sock){if(await relayJoinAny(sock,code))return;return say('Room not found. Check the 6-digit code and make sure the host is waiting.')}
  const [r,g]=await Promise.all([sget('room:'+code),sget('grp:'+code)]);
  if(g&&!g.closed&&GM[g.g]&&Date.now()-g.t<300000){if(await mpStoreJoin(code,say,g))return;return say('Could not join — shared storage did not respond.')}
  if(r&&r.status!=='closed'&&MP[r.game]){
    if(r.guest&&r.guest.id!==pid())return say('That room is already full.');
    const old=await sget('room:'+code+':g'),seq=old&&old.guest&&old.guest.id===pid()?(old.seq||0):0;
    if(!(await sset('room:'+code+':g',{guest:{id:pid(),name:pname(),av:S.avatar},seq,act:null,hb:Date.now()})))return say('Could not reach shared storage.');
    return mpRoom({role:'guest',code,gk:r.game,room:r,seq})}
  if(!window.__peerBad&&await mpPeerJoin(code,say))return;
  say('Room not found. Check the 6-digit code and make sure the host is waiting with the page open. (If the host used manual codes, use "Join with manual codes" at the bottom.)')}

function mkPeerLink(conn){

  const c={on(e,f){(H[e]||(H[e]=[])).push(f);if(e==='open')setTimeout(f,0);return c},
    send(d){if(!closed){try{conn.send(d)}catch(e){}}},
    close(){if(!closed){closed=true;try{conn.close()}catch(e){}}},
    _in(d){H.data.forEach(f=>f(d))},
    _close(){if(closed)return;closed=true;H.close.forEach(f=>f())}};

function ringPeerHost(peer,code){

 else if(t.id==='reset'){if(!armed){armed=true;t.textContent='Tap again to confirm reset'}else{S={theme:S.theme,fav:[],recent:[],stats:{},sound:true,daily:{},ach:[],avatar:'🚀'};save();toast('Local data cleared');profile()}}
});
document.addEventListener('change',e=>{if(e.target.id==='so'){F.sort=e.target.value;drawResults()}});
$('#dc').onclick=()=>$('#dlg').close();

(async()=>{await load();applyTheme();go('home')})();
</script>
